<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboTech Tunisia | DIY Robot Kits</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 48, 0.7);
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.25);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --whatsapp-green: #25D366;
            --facebook-blue: #1877F2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ANNOUNCEMENT BANNER */
        .announcement-bar {
            background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
            border-bottom: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.6rem 1rem;
            font-size: 0.85rem;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            position: sticky;
            top: 0;
            z-index: 101;
        }

        .announcement-bar span {
            color: var(--text-muted);
        }

        .announcement-links {
            display: inline-flex;
            gap: 8px;
        }

        .social-tag {
            text-decoration: none;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 0.78rem;
            font-weight: 600;
            color: #fff;
            transition: opacity 0.2s;
        }

        .social-tag.wa { background-color: var(--whatsapp-green); }
        .social-tag.fb { background-color: var(--facebook-blue); }
        .social-tag:hover { opacity: 0.85; }

        /* HEADER & LOGO */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 5%;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .logo-img {
            height: 36px;
            width: auto;
            border-radius: 6px;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 2.5rem 1rem 1rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .hero p {
            color: var(--text-muted);
            font-size: clamp(0.9rem, 3vw, 1.1rem);
        }

        /* PRODUCT GRID (SIDE-BY-SIDE ON MOBILE) */
        .container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 2 side-by-side on mobile */
            gap: 12px;
        }

        @media (min-width: 640px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }
        }

        /* SCROLL ANIMATION CARD CLASS */
        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, opacity 0.6s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            
            /* Initial Scroll State: Hidden */
            opacity: 0;
            transform: translateY(30px);
        }

        /* Active Scroll State: Revealed */
        .card.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-cyan);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .card-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            background-color: #1e293b;
        }

        .card-body {
            padding: 0.85rem;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: clamp(0.85rem, 2.5vw, 1.05rem);
            font-weight: 600;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .card-price {
            font-size: clamp(0.95rem, 3vw, 1.2rem);
            font-weight: 800;
            color: var(--accent-cyan);
            margin-bottom: 0.75rem;
        }

        .btn-details {
            width: 100%;
            padding: 0.5rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            border-radius: 10px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        /* MODAL POPUP */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            animation: popIn 0.25s ease-out;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.2rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
        }

        .modal-title {
            font-size: 1.3rem;
            margin-bottom: 0.4rem;
            padding-right: 1.5rem;
        }

        .modal-price {
            font-size: 1.2rem;
            color: var(--accent-cyan);
            font-weight: 800;
            margin-bottom: 0.8rem;
        }

        .modal-desc {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 1.2rem;
        }

        .btn-whatsapp {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 0.85rem;
            background-color: var(--whatsapp-green);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 10px;
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <!-- TOP IMPORT ANNOUNCEMENT BAR -->
    <div class="announcement-bar">
        <span>Want something special imported? Contact us:</span>
        <div class="announcement-links">
            <a href="https://wa.me/21612345678?text=Hello,%20I%20want%20to%20import%20a%20special%20item" target="_blank" class="social-tag wa">WhatsApp</a>
            <a href="https://facebook.com/your-page-link" target="_blank" class="social-tag fb">Facebook</a>
        </div>
    </div>

    <!-- HEADER -->
    <header>
        <a href="#" class="logo-container">
            <img src="https://via.placeholder.com/40/38bdf8/0b0f19?text=R" alt="Logo" class="logo-img">
            <span class="logo-text">ROBOTEC.TN</span>
        </a>
    </header>

    <!-- HERO -->
    <section class="hero">
        <h1>DIY Robotics & Kits</h1>
        <p>Premium educational kits for university projects and hobbies in Tunisia.</p>
    </section>

    <!-- PRODUCT GRID -->
    <main class="container">
        <div class="grid" id="product-grid"></div>
    </main>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-price" id="modal-price"></div>
            <p class="modal-desc" id="modal-desc"></p>
            <a href="#" id="modal-wa-btn" target="_blank" class="btn-whatsapp">
                Order via WhatsApp
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 RoboTec Tunisia — University Project Store</p>
    </footer>

    <script>
        const MY_PHONE_NUMBER = "21612345678"; // Replace with your phone number

        // 10 PRODUCT ITEMS
        const products = [
            { id: 1, name: "4WD Smart Car Rover", price: "85 TND", image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?w=500&q=80", description: "4WD robotic chassis with Arduino, ultrasonic obstacle avoidance sensor, and motor driver shield." },
            { id: 2, name: "Bipedal Walker Bot", price: "120 TND", image: "https://images.unsplash.com/photo-1535378273068-9bb67d5beacd?w=500&q=80", description: "Humanoid walking kit powered by 4 servo motors. Includes bluetooth module for phone control." },
            { id: 3, name: "4-DOF Robotic Arm", price: "140 TND", image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500&q=80", description: "Acrylic desktop mechanical claw with analog joysticks for learning servo control kinematics." },
            { id: 4, name: "ESP32-CAM WiFi Bot", price: "95 TND", image: "https://images.unsplash.com/photo-1563770660941-20978e870e26?w=500&q=80", description: "Video-streaming robot controlled over local WiFi network using onboard ESP32-CAM module." },
            { id: 5, name: "PID Line Follower Kit", price: "65 TND", image: "https://images.unsplash.com/photo-1581092160607-ee22621dd758?w=500&q=80", description: "High-speed line tracing robot with 5 IR sensor array and high-RPM micro metal gearmotors." },
            { id: 6, name: "Spider Hexapod Kit", price: "180 TND", image: "https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?w=500&q=80", description: "6-legged spider crawler bot using 18 micro servos for realistic terrain traversal." },
            { id: 7, name: "AI Vision Smart Kit", price: "210 TND", image: "https://images.unsplash.com/photo-1507146426996-ef05306b995a?w=500&q=80", description: "Object tracking and face recognition camera kit designed for Raspberry Pi/Jetson projects." },
            { id: 8, name: "Tank Tracked Rover", price: "135 TND", image: "https://images.unsplash.com/photo-1518770660439-4636190af475?w=500&q=80", description: "All-terrain tracked platform with dual high-torque DC motors and durable rubber treads." },
            { id: 9, name: "IoT Smart Greenhouse", price: "110 TND", image: "https://images.unsplash.com/photo-1585338107529-13afc5f02586?w=500&q=80", description: "Automated plant monitoring station with soil moisture, temp/humidity sensors, and mini water pump." },
            { id: 10, name: "Self-Balancing Robot", price: "150 TND", image: "https://images.unsplash.com/photo-1531746790731-6c087fecd65a?w=500&q=80", description: "2-wheeled inverted pendulum bot using MPU6050 gyroscope and PID feedback control." }
        ];

        // RENDER PRODUCTS
        const grid = document.getElementById('product-grid');
        products.forEach(p => {
            grid.innerHTML += `
                <div class="card" onclick="openModal(${p.id})">
                    <img src="${p.image}" alt="${p.name}" class="card-img" loading="lazy">
                    <div class="card-body">
                        <div>
                            <div class="card-title">${p.name}</div>
                            <div class="card-price">${p.price}</div>
                        </div>
                        <button class="btn-details">Details</button>
                    </div>
                </div>
            `;
        });

        // SCROLL ANIMATION OBSERVER
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('reveal');
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.card').forEach(card => observer.observe(card));

        // MODAL HANDLERS
        function openModal(id) {
            const product = products.find(p => p.id === id);
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = product.price;
            document.getElementById('modal-desc').innerText = product.description;

            const msg = encodeURIComponent(`Hello! I want to order the ${product.name} (${product.price}).`);
            document.getElementById('modal-wa-btn').href = `https://wa.me/${MY_PHONE_NUMBER}?text=${msg}`;

            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        window.onclick = function(e) {
            if (e.target == document.getElementById('modal-overlay')) closeModal();
        }
    </script>
</body>
</html>
