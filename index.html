<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-Kits Tunisia | Store</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      color: var(--accent);
    }

    /* Search & Filter Controls */
    .controls-container {
      max-width: 900px;
      margin: 0 auto 2.5rem auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }

    .search-box {
      width: 100%;
      max-width: 500px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border-radius: 25px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
    }

    .cat-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent);
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 3rem;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>R-Kits Tunisia</h1>
    <p style="color: var(--text-muted);">Robotics & Embedded Systems Store</p>
  </header>

  <div class="controls-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search products, sensors, boards..." oninput="applyFilters()">
    </div>

    <div class="categories" id="categoryButtons">
      <button class="cat-btn active" onclick="setCategory('all', this)">All</button>
      <button class="cat-btn" onclick="setCategory('kits', this)">DIY Kits</button>
      <button class="cat-btn" onclick="setCategory('boards', this)">Boards</button>
      <button class="cat-btn" onclick="setCategory('motors', this)">Motors</button>
      <button class="cat-btn" onclick="setCategory('sensors', this)">Sensors</button>
    </div>
  </div>

  <main class="product-grid" id="productContainer"></main>

  <script>
    const products = [
      { id: 1, title: '4WD Smart Robot Car Kit', category: 'kits', price: '120 TND', desc: 'Complete chassis kit with motor drivers and Bluetooth module.' },
      { id: 2, title: 'Arduino Uno R3', category: 'boards', price: '28 TND', desc: 'ATmega328P development board with USB cable.' },
      { id: 3, title: 'ESP32 Wi-Fi + BT Board', category: 'boards', price: '35 TND', desc: 'Dual-core microcontroller with wireless connectivity.' },
      { id: 4, title: 'L298N Motor Driver', category: 'motors', price: '12 TND', desc: 'Dual H-bridge driver module for DC and stepper motors.' },
      { id: 5, title: 'SG90 Servo Motor (4 Pack)', category: 'motors', price: '24 TND', desc: '9g micro servo motors ideal for lightweight robotic joints.' },
      { id: 6, title: 'HC-SR04 Ultrasonic Sensor', category: 'sensors', price: '8 TND', desc: 'Distance measurement sensor with 2cm-400cm range.' },
      { id: 7, title: 'ESP32-CAM Camera Module', category: 'sensors', price: '32 TND', desc: 'Integrated OV2640 camera with Wi-Fi video streaming.' },
      { id: 8, title: '4-DOF Robotic Arm Kit', category: 'kits', price: '95 TND', desc: 'Acrylic robotic arm frame with servos for manipulation.' }
    ];

    let currentCategory = 'all';

    function setCategory(cat, element) {
      currentCategory = cat;
      
      // Update active button state
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      applyFilters();
    }

    function applyFilters() {
      const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('productContainer');
      
      const filtered = products.filter(product => {
        const matchesCategory = (currentCategory === 'all') || (product.category === currentCategory);
        const matchesSearch = product.title.toLowerCase().includes(searchQuery) || 
                              product.desc.toLowerCase().includes(searchQuery);
        
        return matchesCategory && matchesSearch;
      });

      renderProducts(filtered);
    }

    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      
      if (items.length === 0) {
        container.innerHTML = `<div class="no-results">No products found matching your search.</div>`;
        return;
      }

      container.innerHTML = items.map(product => `
        <div class="card">
          <div>
            <h3>${product.title}</h3>
            <p>${product.desc}</p>
          </div>
          <div class="card-footer">
            <span class="price">${product.price}</span>
          </div>
        </div>
      `).join('');
    }

    // Initial render
    applyFilters();
  </script>
</body>
</html>
