<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-Kits Tunisia | Robotics Store</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding-bottom: 3rem;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      inset: 0;
      background-color: var(--bg-dark);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: opacity 0.5s ease;
    }

    #splash h1 {
      font-size: 3rem;
      color: var(--accent);
      letter-spacing: 2px;
      animation: splashEntrance 1s ease forwards;
    }

    @keyframes splashEntrance {
      0% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Header & Navigation */
    header {
      text-align: center;
      padding: 2.5rem 1rem 1.5rem 1rem;
    }

    header h1 {
      font-size: 2.5rem;
      color: var(--accent);
      margin-bottom: 0.3rem;
    }

    /* Controls: Search & Category Filter */
    .controls-container {
      max-width: 900px;
      margin: 0 auto 2.5rem auto;
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      align-items: center;
    }

    .search-box {
      width: 100%;
      max-width: 550px;
    }

    .search-box input {
      width: 100%;
      padding: 0.9rem 1.4rem;
      border-radius: 30px;
      border: 1px solid var(--border);
      background-color: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.2);
    }

    .categories {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      justify-content: center;
    }

    .cat-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.6rem 1.2rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background-color: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    /* Product Grid & Reveal Animation */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease, border-color 0.2s;
    }

    .card.reveal {
      opacity: 1;
      transform: translateY(0);
    }

    .card:hover {
      border-color: var(--accent);
    }

    .card-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #000;
    }

    .card-body {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card h3 {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 1.2rem;
      line-height: 1.4;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }

    .price {
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--accent);
    }

    .btn-order {
      background-color: transparent;
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
    }

    .btn-order:hover {
      background-color: var(--accent);
      color: #000;
    }

    .no-results {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--text-muted);
      padding: 4rem 1rem;
      font-size: 1.1rem;
    }

    /* Modal Overlay */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 1rem;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 480px;
      width: 100%;
      padding: 1.8rem;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
    }

    .modal-fb-btn {
      display: block;
      width: 100%;
      text-align: center;
      background-color: #1877f2;
      color: #fff;
      text-decoration: none;
      padding: 0.8rem;
      border-radius: 6px;
      font-weight: bold;
      margin-top: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- Splash Screen Entrance -->
  <div id="splash">
    <h1>R-KITS TUNISIA</h1>
    <p style="color: var(--text-muted);">Robotics & Embedded Systems</p>
  </div>

  <header>
    <h1>R-Kits Tunisia</h1>
    <p style="color: var(--text-muted);">Build your next engineering project</p>
  </header>

  <!-- Integrated Search & Category Controls -->
  <div class="controls-container">
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search products (e.g. Arduino, Servo, Camera)..." oninput="applyFilters()">
    </div>

    <div class="categories" id="categoryButtons">
      <button class="cat-btn active" onclick="setCategory('all', this)">All Products</button>
      <button class="cat-btn" onclick="setCategory('kits', this)">DIY Kits</button>
      <button class="cat-btn" onclick="setCategory('boards', this)">Boards</button>
      <button class="cat-btn" onclick="setCategory('motors', this)">Motors</button>
      <button class="cat-btn" onclick="setCategory('sensors', this)">Sensors</button>
    </div>
  </div>

  <!-- Dynamic Catalog Grid -->
  <main class="product-grid" id="productContainer"></main>

  <!-- Facebook Order Modal -->
  <div id="modal-overlay">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle" style="margin-bottom: 0.5rem;">Product Name</h2>
      <p id="modalPrice" style="color: var(--accent); font-weight: bold; margin-bottom: 1rem;">0 TND</p>
      <p id="modalDesc" style="color: var(--text-muted); line-height: 1.5;">Description text goes here.</p>
      <a id="modalFbLink" href="https://facebook.com/your-page-link" target="_blank" class="modal-fb-btn">
        Order via Facebook Message
      </a>
    </div>
  </div>

  <script>
    // Database Catalog
    const products = [
      { id: 1, title: '4WD Smart Robot Car Kit', category: 'kits', price: '120 TND', img: 'https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=400&q=80', desc: 'Complete 4WD robotic chassis kit with motor driver, sensors, and Bluetooth controller.' },
      { id: 2, title: 'Arduino Uno R3 Board', category: 'boards', price: '28 TND', img: 'https://images.unsplash.com/photo-1553406830-ef2513450d76?auto=format&fit=crop&w=400&q=80', desc: 'Original ATmega328P development board with USB interface for fast prototyping.' },
      { id: 3, title: 'ESP32 Wi-Fi + Bluetooth', category: 'boards', price: '35 TND', img: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=400&q=80', desc: 'Dual-core 240MHz microcontroller with built-in Wi-Fi and BLE for IoT applications.' },
      { id: 4, title: 'L298N Dual Motor Driver', category: 'motors', price: '12 TND', img: 'https://images.unsplash.com/photo-1608564697071-ddf911d81370?auto=format&fit=crop&w=400&q=80', desc: 'Dual H-bridge driver board capable of driving two DC motors or one 4-wire stepper.' },
      { id: 5, title: 'SG90 Micro Servos (4 Pack)', category: 'motors', price: '24 TND', img: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=400&q=80', desc: 'High-speed 9g lightweight micro servos ideal for robotic arms and steering.' },
      { id: 6, title: 'HC-SR04 Ultrasonic Sensor', category: 'sensors', price: '8 TND', img: 'https://images.unsplash.com/photo-1517077304055-6e89abbf09b0?auto=format&fit=crop&w=400&q=80', desc: 'Non-contact distance measurement module capable of detecting objects from 2cm to 400cm.' },
      { id: 7, title: 'ESP32-CAM Video Module', category: 'sensors', price: '32 TND', img: 'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?auto=format&fit=crop&w=400&q=80', desc: 'Small-form camera development board with OV2640 sensor and TF card slot.' },
      { id: 8, title: '4-DOF Acrylic Robot Arm', category: 'kits', price: '95 TND', img: 'https://images.unsplash.com/photo-1561557944-6e7860d1a7eb?auto=format&fit=crop&w=400&q=80', desc: 'Precision laser-cut acrylic arm kit including 4 mini servos for mechanical picking.' }
    ];

    let currentCategory = 'all';

    // Splash Screen Timer
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash');
        splash.style.opacity = '0';
        setTimeout(() => splash.style.display = 'none', 500);
      }, 1500);
    });

    // Category Selector
    function setCategory(cat, element) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
      applyFilters();
    }

    // Combined Search and Category Filter
    function applyFilters() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      
      const filtered = products.filter(p => {
        const matchesCategory = (currentCategory === 'all') || (p.category === currentCategory);
        const matchesSearch = p.title.toLowerCase().includes(query) || p.desc.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      renderProducts(filtered);
    }

    // Render Product Cards
    function renderProducts(items) {
      const container = document.getElementById('productContainer');
      
      if (items.length === 0) {
        container.innerHTML = `<div class="no-results">No products found matching your search.</div>`;
        return;
      }

      container.innerHTML = items.map(p => `
        <div class="card">
          <img src="${p.img}" alt="${p.title}" class="card-img" />
          <div class="card-body">
            <h3>${p.title}</h3>
            <p>${p.desc}</p>
            <div class="card-footer">
              <span class="price">${p.price}</span>
              <button class="btn-order" onclick="openModal(${p.id})">Order</button>
            </div>
          </div>
        </div>
      `).join('');

      observeScrollAnimations();
    }

    // Scroll Reveal Animation via IntersectionObserver
    function observeScrollAnimations() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('reveal');
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.card').forEach(card => observer.observe(card));
    }

    // Facebook Order Modal Logic
    function openModal(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;

      document.getElementById('modalTitle').textContent = product.title;
      document.getElementById('modalPrice').textContent = product.price;
      document.getElementById('modalDesc').textContent = product.desc;
      
      // Pass product name in Facebook URL
      const fbUrl = `https://facebook.com/your-page-link?text=Hello,%20I%20want%20to%20order%20the%20${encodeURIComponent(product.title)}`;
      document.getElementById('modalFbLink').setAttribute('href', fbUrl);

      document.getElementById('modal-overlay').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modal-overlay').style.display = 'none';
    }

    // Initialize Catalog
    applyFilters();
  </script>
</body>
</html>
