<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboTech Tunisia | DIY Robot Kits</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 48, 0.7);
            --accent-cyan: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --whatsapp-green: #25D366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER & LOGO */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            background: rgba(11, 15, 25, 0.8);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        /* PLACE YOUR LOGO IMAGE HERE OR USE THE TEXT LOGO */
        .logo-img {
            height: 40px;
            width: auto;
            border-radius: 8px;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 0%, var(--accent-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* HERO SECTION */
        .hero {
            text-align: center;
            padding: 4rem 1rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 2.8rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* PRODUCT GRID */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 30px var(--accent-glow);
        }

        .card-img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #1e293b;
        }

        .card-body {
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card-price {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--accent-cyan);
            margin-bottom: 1rem;
        }

        .btn-details {
            width: 100%;
            padding: 0.75rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .card:hover .btn-details {
            background: var(--accent-cyan);
            color: var(--bg-color);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal {
            background: #131b2e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            padding: 2rem;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 1.2rem;
            right: 1.5rem;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.8rem;
            cursor: pointer;
        }

        .modal-title {
            font-size: 1.6rem;
            margin-bottom: 0.5rem;
        }

        .modal-price {
            font-size: 1.4rem;
            color: var(--accent-cyan);
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .modal-desc {
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }

        .btn-whatsapp {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 1rem;
            background-color: var(--whatsapp-green);
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 12px;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .btn-whatsapp:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }

        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo-container">
            <!-- LOGO PLACEHOLDER: Replace src with your image file link when ready -->
            <img src="https://via.placeholder.com/40/38bdf8/0b0f19?text=R" alt="Logo" class="logo-img">
            <span class="logo-text">ROBOTEC.TN</span>
        </a>
    </header>

    <section class="hero">
        <h1>Build the Future Today</h1>
        <p>Premium educational robotics & micro-controller kits for students and makers.</p>
    </section>

    <main class="container">
        <div class="grid" id="product-grid"></div>
    </main>

    <!-- PRODUCT DETAILS POPUP -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 class="modal-title" id="modal-title"></h2>
            <div class="modal-price" id="modal-price"></div>
            <p class="modal-desc" id="modal-desc"></p>
            <a href="#" id="modal-wa-btn" target="_blank" class="btn-whatsapp">
                Order via WhatsApp (Cash on Delivery)
            </a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 RoboTec Tunisia — University Project Store</p>
    </footer>

    <script>
        // SET YOUR TUNISIAN PHONE NUMBER HERE (Without + or spaces, e.g., 21612345678)
        const MY_PHONE_NUMBER = "21612345678";

        // PRODUCT DATA
        const products = [
            {
                id: 1,
                name: "Smart Rover Starter Kit",
                price: "85 TND",
                image: "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=600&q=80",
                description: "Complete Arduino 4WD obstacle avoidance robot. Includes UNO board, ultrasonic sensor, motor driver, and acrylic chassis."
            },
            {
                id: 2,
                name: "Bipedal Walker Bot",
                price: "120 TND",
                image: "https://images.unsplash.com/photo-1535378273068-9bb67d5beacd?auto=format&fit=crop&w=600&q=80",
                description: "Humanoid walking kit powered by 4 servo motors. Learn smooth gait kinematics and remote bluetooth control."
            },
            {
                id: 3,
                name: "Robotic Arm 4-DOF",
                price: "140 TND",
                image: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=600&q=80",
                description: "Desktop mechanical claw arm with joystick controls. Perfect for learning industrial automation basics."
            }
        ];

        // RENDER PRODUCTS
        const grid = document.getElementById('product-grid');
        products.forEach(p => {
            grid.innerHTML += `
                <div class="card" onclick="openModal(${p.id})">
                    <img src="${p.image}" alt="${p.name}" class="card-img">
                    <div class="card-body">
                        <div class="card-title">${p.name}</div>
                        <div class="card-price">${p.price}</div>
                        <button class="btn-details">View Details</button>
                    </div>
                </div>
            `;
        });

        // MODAL LOGIC
        function openModal(id) {
            const product = products.find(p => p.id === id);
            document.getElementById('modal-title').innerText = product.name;
            document.getElementById('modal-price').innerText = product.price;
            document.getElementById('modal-desc').innerText = product.description;

            // Generate WhatsApp order message link
            const message = encodeURIComponent(`Hello! I would like to order the ${product.name} for ${product.price}.`);
            document.getElementById('modal-wa-btn').href = `https://wa.me/${MY_PHONE_NUMBER}?text=${message}`;

            document.getElementById('modal-overlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        // Close modal when clicking outside
        window.onclick = function(e) {
            if (e.target == document.getElementById('modal-overlay')) closeModal();
        }
    </script>
</body>
</html>
